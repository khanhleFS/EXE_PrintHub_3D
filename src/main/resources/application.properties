spring.application.name=PrintHub_3D

spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
# Mail Configuration (Resend HTTP API)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${MAIL_FROM:onboarding@resend.dev}

# Mail Configuration (Gmail SMTP Backup)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=5

# Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
server.forward-headers-strategy=framework
# Show all endpoints including without @Operation

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# JWT Configuration
jwt.secret=${JWT_SECRET:c3VwZXJzZWNyZXRqd3RzZWNyZXRrZXlmb3JwcmludGh1YjNkeXl5eXl5eXl5eXl5eXl5eXl5}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

#Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# PayOS Payment Gateway Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/#/payment-result}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/#/payment-result?cancel=true}

# Multipart Upload Configuration (3D STL/STEP files & HD images)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Frontend URL & Transactional Email Outbox (Flow 07)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.email-outbox.enabled=${EMAIL_OUTBOX_ENABLED:false}
app.email-outbox.enqueue-enabled=${EMAIL_OUTBOX_ENQUEUE_ENABLED:true}
app.email-outbox.batch-size=${EMAIL_OUTBOX_BATCH_SIZE:20}
app.email-outbox.lease-seconds=${EMAIL_OUTBOX_LEASE_SECONDS:60}
app.email-outbox.poll-delay-ms=${EMAIL_OUTBOX_POLL_DELAY_MS:10000}
app.email-outbox.connect-timeout-ms=${EMAIL_OUTBOX_CONNECT_TIMEOUT_MS:5000}
app.email-outbox.read-timeout-ms=${EMAIL_OUTBOX_READ_TIMEOUT_MS:10000}
