# Profile dành riêng cho môi trường PostgreSQL test cô lập trên Docker local
# Host: localhost:5433 | DB: printhub_test

spring.datasource.url=jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5433}/${TEST_DB_NAME:printhub_test}?sslmode=disable
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate: Chế độ kiểm tra schema nghiêm ngặt sau khi áp SQL migration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tắt tự động nạp data.sql để giữ môi trường test độc lập
spring.sql.init.mode=never

# Redis (kết nối container exe-dev port 6380)
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# Mock / Sandbox cho PayOS trong test
payos.return-url=http://localhost:5173/payment-result
payos.cancel-url=http://localhost:5173/payment-result?cancel=true
