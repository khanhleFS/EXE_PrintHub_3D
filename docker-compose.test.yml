name: printhub-test
services:
  test-postgres:
    image: postgres:16-alpine
    container_name: printhub-test-postgres
    environment:
      POSTGRES_DB: printhub_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d printhub_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - printhub_test_pgdata:/var/lib/postgresql/data

volumes:
  printhub_test_pgdata:
    name: printhub_test_pgdata
